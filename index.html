<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spring Awakening México · NOS Teatro</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Manrope',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0d1b3e 0%,#1a3a6b 60%,#1e5096 100%);color:#fff;padding:2rem}
  .box{max-width:720px;margin:0 auto;text-align:center}
  .tag{display:inline-block;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;border:1px solid #4a9fd4;color:#cfe4f6;border-radius:999px;padding:.35rem .9rem;margin-bottom:1.4rem}
  h1{font-size:clamp(2rem,7vw,3.6rem);font-weight:800;line-height:1.1;margin-bottom:1rem}
  p{font-size:1.05rem;color:#cfe4f6;line-height:1.6}
  .nos{margin-top:2.2rem;font-size:13px;color:#8fb8dd;letter-spacing:.5px}
  @media (max-width:600px){p{font-size:.95rem}}
  @page{size:Letter;margin:12mm}
  @media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}a[href]:after{content:none}}
</style>
</head>
<body>
  <div class="box">
    <span class="tag">Próximamente</span>
    <h1>Spring Awakening México</h1>
    <p>Muy pronto abriremos aquí el registro para el casting.</p>
    <p class="nos">Una producción de NOS Teatro</p>
  </div>
</body>
</html>
